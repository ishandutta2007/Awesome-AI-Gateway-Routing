<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.7" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes ringGlow {
        0%, 100% { r: 18px; opacity: 0.3; }
        50% { r: 26px; opacity: 0.8; }
      }

      .node-pulse { transform-origin: center; animation: pulseNode 3.5s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 8, 8; animation: dashFlow 12s linear infinite; }
      .pill-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .pill-float-2 { animation: floatAlt 7s ease-in-out infinite; }
      .ring-anim { animation: ringGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Overlay for Tech Look -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic / Animated Background Routing Flows -->
  <g opacity="0.45">
    <!-- Network Flow Paths -->
    <path class="flow-line" d="M 60,80 Q 250,30 420,90 T 780,70 T 1140,80" fill="none" stroke="#00f2fe" stroke-width="1.8" />
    <path class="flow-line" d="M 60,280 Q 280,330 520,270 T 880,310 T 1140,280" fill="none" stroke="#8a2be2" stroke-width="1.8" />
    <path class="flow-line" d="M 120,40 C 300,160 500,20 700,160 S 1080,80 1120,200" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
    <path class="flow-line" d="M 80,320 C 320,220 540,340 820,220 S 1050,320 1160,180" fill="none" stroke="#ec4899" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Glowing Hub Circles / Dynamic Nodes (Background) -->
  <g opacity="0.55">
    <circle cx="160" cy="90" class="ring-anim" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="160" cy="90" r="7" fill="#00f2fe" class="node-pulse" />

    <circle cx="1040" cy="90" class="ring-anim" fill="none" stroke="#8a2be2" stroke-width="1.5" />
    <circle cx="1040" cy="90" r="7" fill="#c084fc" class="node-pulse" />

    <circle cx="120" cy="270" class="ring-anim" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="120" cy="270" r="6" fill="#38bdf8" class="node-pulse" />

    <circle cx="1080" cy="260" class="ring-anim" fill="none" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="1080" cy="260" r="6" fill="#fb7185" class="node-pulse" />
  </g>

  <!-- Floating Feature Badges / Pills (Layered behind main text) -->
  <g opacity="0.8">
    <!-- Top-Left Floating Pill -->
    <g class="pill-float-1" transform="translate(90, 48)">
      <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#00f2fe" stroke-width="1" opacity="0.85" />
      <circle cx="18" cy="17" r="4" fill="#00f2fe" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">⚡ Multi-LLM Router</text>
    </g>

    <!-- Top-Right Floating Pill -->
    <g class="pill-float-2" transform="translate(920, 48)">
      <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.85" />
      <circle cx="18" cy="17" r="4" fill="#a855f7" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">🛡️ Guardrails &amp; Fallback</text>
    </g>

    <!-- Bottom-Left Floating Pill -->
    <g class="pill-float-2" transform="translate(100, 276)">
      <rect width="195" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">💰 Cost &amp; Latency Tuning</text>
    </g>

    <!-- Bottom-Right Floating Pill -->
    <g class="pill-float-1" transform="translate(910, 276)">
      <rect width="195" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.85" />
      <circle cx="18" cy="17" r="4" fill="#10b981" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">🔄 Universal OpenAI API</text>
    </g>
  </g>

  <!-- Center Backing Glow Box to keep foreground perfectly readable -->
  <rect x="250" y="80" width="700" height="195" rx="24" fill="#0b1120" opacity="0.75" filter="url(#softShadow)" />
  <rect x="250" y="80" width="700" height="195" rx="24" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" opacity="0.6" />

  <!-- FOREGROUND: Main Title and Subtitle (Guaranteed in Foreground) -->
  <g text-anchor="middle" filter="url(#softShadow)">
    <!-- Small Category Pill -->
    <g transform="translate(600, 114)">
      <rect x="-110" y="-14" width="220" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">🚀 PRODUCTION ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome AI Gateway &amp; Routing
    </text>

    <!-- Title Accent Underline -->
    <rect x="420" y="188" width="360" height="3" rx="1.5" fill="url(#cyanPurple)" />

    <!-- Subtitle -->
    <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Curated Multi-Provider Routers, Fallbacks, Semantic Caching &amp; Unified LLM APIs
    </text>

    <!-- Model Provider Badges (Foreground Bottom) -->
    <text x="600" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
      CLAUDE  •  OPENAI  •  GEMINI  •  LLAMA  •  DEEPSEEK  •  MISTRAL  •  vLLM
    </text>
  </g>
</svg>
